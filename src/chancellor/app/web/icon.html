<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chancellor icon</title>
  <style>
    :root { --navy: #0f1726; --surface: #1c2a47; --gold: #c9a24a; --danger: #e07a64; }
    /* The window itself is clipped to a circle (layout.make_round), so the circle fills it. */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; user-select: none; }
    body { background: var(--navy); }
    .icon {
      position: absolute; inset: 0;
      border-radius: 50%; border: 3px solid var(--gold); box-sizing: border-box;
      background: var(--navy);
      display: grid; place-items: center; cursor: grab;
    }
    .icon:hover { background: var(--surface); }
    .icon:active { cursor: grabbing; }
    .icon.open { background: var(--gold); }
    .icon.open svg { stroke: var(--navy); }
    .icon.error { border-color: var(--danger); }
    svg { width: 30px; height: 30px; fill: none; stroke: var(--gold); stroke-width: 1.8;
          stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .close {
      position: absolute; top: 9px; right: 9px;
      width: 16px; height: 16px; border-radius: 50%; border: none; padding: 0;
      background: var(--navy); color: var(--gold); font: 12px/16px sans-serif;
      cursor: pointer; opacity: 0; transition: opacity 120ms ease;
    }
    body:hover .close { opacity: 1; }
    .close:hover { color: var(--danger); }
  </style>
</head>
<body>
  <div id="icon" class="icon" role="button" tabindex="0" aria-pressed="false"
       aria-label="Open the Chancellor" title="Chancellor: click to open, drag to move">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5L3 8z"/>
      <path d="M5 21h14"/>
    </svg>
  </div>
  <button id="close" class="close" type="button" aria-label="Close the Chancellor" title="Close the Chancellor">×</button>
  <script>
    // The page reports the press and the release; Python moves the window with the
    // pointer in between (PanelApi.icon_down / icon_up). Python cannot see the button
    // itself while the game runs as administrator, but clicks on this window arrive.
    const icon = document.getElementById("icon");
    let pressed = false;

    // Python calls this whenever the overlay opens or closes (also from the panel).
    window.setOpen = (open) => {
      icon.classList.toggle("open", open);
      icon.setAttribute("aria-pressed", String(open));
    };

    icon.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      pressed = true;
      icon.setPointerCapture(event.pointerId); // the release arrives even off the icon
      window.pywebview.api.icon_down();
    });

    async function release() {
      if (!pressed) return;
      pressed = false;
      const result = await window.pywebview.api.icon_up();
      icon.classList.toggle("error", !result.ok);
      icon.title = result.ok ? "Chancellor: click to open, drag to move" : result.error;
    }

    icon.addEventListener("pointerup", release);
    icon.addEventListener("lostpointercapture", release);

    const close = document.getElementById("close");
    close.addEventListener("pointerdown", (event) => event.stopPropagation());
    close.addEventListener("click", () => window.pywebview.api.quit());
  </script>
</body>
</html>
